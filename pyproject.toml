[project]
name = "fastshot"
version = "0.1.0"
description = "Keyboard-first cross-platform screenshot utility"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "comtypes>=1.4.16",
    "keyboard>=0.13.5",
    "mss>=10.1.0",
    "pillow>=11.3.0",
    "pyside6>=6.10.0",
    "pywin32>=311; sys_platform == 'win32'",
]

[project.scripts]
fastshot = "fastshot.app:main"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"
